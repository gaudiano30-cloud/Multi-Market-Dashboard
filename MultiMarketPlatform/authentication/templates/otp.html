{% extends 'base.html' %}
{% block content %}
<h2>Verifica OTP</h2>
<p class="intro">Apri l'app Authenticator associata al tuo account e inserisci il codice temporaneo. La verifica è valida per 5 minuti dall'inserimento della password.</p>
<form method="post" action="{{ url_for('auth.otp') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="otp">Codice a 6 cifre</label>
  <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="000000" required autofocus>
  <button type="submit" class="button primary">Accedi alla dashboard</button>
</form>
<p class="small"><a href="{{ url_for('auth.signin') }}">Torna a Sign in</a></p>
{% endblock %}
